<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自分史絵本 - AIインタビュー</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border: #334155;
            --shadow: rgba(99, 102, 241, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, var(--bg-main) 0%, #1a1f3a 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px var(--shadow);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .logo-text {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s;
        }

        .status-badge.connected {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .status-badge.disconnected {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-badge.connected .status-dot {
            background: var(--success);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Main Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 2rem;
        }

        @media (max-width: 1024px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* Chat Section */
        .chat-section {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .card-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .chat-container {
            flex: 1;
            min-height: 500px;
            max-height: 600px;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar {
            width: 8px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: var(--bg-input);
            border-radius: 4px;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 4px;
        }

        .message {
            padding: 1rem 1.25rem;
            border-radius: 16px;
            max-width: 80%;
            animation: slideIn 0.3s ease;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            align-self: flex-end;
            margin-left: auto;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .message.ai {
            background: var(--bg-input);
            color: var(--text-primary);
            align-self: flex-start;
            border: 1px solid var(--border);
        }

        .message.system {
            background: rgba(245, 158, 11, 0.1);
            color: var(--warning);
            align-self: center;
            font-size: 0.875rem;
            border: 1px solid var(--warning);
            max-width: 90%;
        }

        /* Input Section */
        .input-section {
            padding: 1.5rem;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .input-group {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            margin-bottom: 1rem;
        }

        .input-group label {
            font-size: 0.875rem;
            color: var(--text-muted);
            min-width: 80px;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.75rem 1rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.875rem;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        textarea {
            width: 100%;
            padding: 1rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
            transition: all 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .button-group {
            display: flex;
            gap: 0.75rem;
            margin-top: 1rem;
        }

        button {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 10px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: inherit;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            flex: 1;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover:not(:disabled) {
            background: var(--border);
            border-color: var(--primary);
        }

        /* Sidebar */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .action-card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid var(--border);
        }

        .action-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .action-button {
            width: 100%;
            padding: 1rem;
            margin-bottom: 0.75rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-input);
            color: var(--text-primary);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .action-button:hover {
            background: var(--primary);
            border-color: var(--primary);
            transform: translateX(4px);
        }

        .action-button.primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            color: white;
            font-size: 1rem;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .action-button.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .icon {
            font-size: 1.25rem;
        }

        /* Loading */
        .loading {
            display: none;
            text-align: center;
            padding: 1.5rem;
            color: var(--text-muted);
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 1rem;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Tooltip */
        [data-tooltip] {
            position: relative;
        }

        [data-tooltip]:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            padding: 0.5rem 0.75rem;
            background: var(--bg-main);
            color: var(--text-primary);
            font-size: 0.75rem;
            border-radius: 6px;
            white-space: nowrap;
            margin-bottom: 0.5rem;
            z-index: 1000;
            border: 1px solid var(--border);
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
                gap: 1rem;
            }

            .header {
                padding: 1rem;
            }

            .logo-text {
                font-size: 1.125rem;
            }

            .message {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-content">
            <div class="logo">
                <div class="logo-icon">📖</div>
                <div class="logo-text">自分史絵本 AI</div>
            </div>
            <div id="status" class="status-badge disconnected">
                <div class="status-dot"></div>
                <span>接続中...</span>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Chat Section -->
        <div class="chat-section">
            <!-- Chat Messages -->
            <div class="card" style="flex: 1; display: flex; flex-direction: column;">
                <div class="card-header">
                    <div class="card-title">💬 インタビュー</div>
                    <button class="btn-secondary" onclick="clearChat()" style="padding: 0.5rem 1rem;">
                        🔄 リセット
                    </button>
                </div>
                <div class="chat-container" id="chatContainer">
                    <div class="message system">
                        💡 ヒント：Enter で送信、Shift+Enter で改行
                    </div>
                </div>

                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <div>AIが考え中...</div>
                </div>
            </div>

            <!-- Input Section -->
            <div class="input-section">
                <div class="input-group">
                    <label>ユーザーID</label>
                    <input type="text" id="userId" value="user_001" />
                </div>
                <textarea id="message" placeholder="メッセージを入力...（例：自分史絵本を作りたいです）" rows="3"></textarea>
                <div class="button-group">
                    <button class="btn-primary" onclick="sendMessage()" id="sendBtn">
                        <span>✉️</span>
                        <span>送信</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="sidebar">
            <!-- Quick Actions -->
            <div class="action-card">
                <div class="action-title">⚡ クイックアクション</div>
                <button class="action-button primary" onclick="completeStoryGeneration()">
                    <span class="icon">🚀</span>
                    <span>物語を生成</span>
                </button>
                <button class="action-button" onclick="getMaterials()">
                    <span class="icon">📦</span>
                    <span>素材生成</span>
                </button>
                <button class="action-button" onclick="generateStory()">
                    <span class="icon">📖</span>
                    <span>自分史生成</span>
                </button>
                <button class="action-button" onclick="generatePicturebook()">
                    <span class="icon">📚</span>
                    <span>絵本生成</span>
                </button>
                <button class="action-button" onclick="generatePicturebookWithImages()">
                    <span class="icon">🎨</span>
                    <span>画像付き絵本</span>
                </button>
            </div>

            <!-- Links -->
            <div class="action-card">
                <div class="action-title">🔗 リンク</div>
                <a href="http://localhost:8000/docs" target="_blank" style="text-decoration: none;">
                    <button class="action-button">
                        <span class="icon">📖</span>
                        <span>API ドキュメント</span>
                    </button>
                </a>
            </div>
        </div>
    </div>

    <script>
        const BASE_URL = 'http://localhost:8000';
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('message');
        const sendBtn = document.getElementById('sendBtn');
        const loading = document.getElementById('loading');
        const statusBadge = document.getElementById('status');

        let isComposing = false;
        let justFinishedComposing = false;

        // 初期化
        window.onload = async () => {
            await checkHealth();
            await startInterview();
            messageInput.focus();
        };

        async function checkHealth() {
            try {
                const response = await fetch(`${BASE_URL}/health`);
                const data = await response.json();
                statusBadge.className = 'status-badge connected';
                statusBadge.innerHTML = '<div class="status-dot"></div><span>接続済み</span>';
            } catch (error) {
                statusBadge.className = 'status-badge disconnected';
                statusBadge.innerHTML = '<div class="status-dot"></div><span>接続失敗</span>';
            }
        }

        async function startInterview() {
            const userId = document.getElementById('userId').value;
            const hasHistory = sessionStorage.getItem(`chat_${userId}`);
            if (hasHistory) return;

            addMessage('system', '📝 インタビューを開始します...');
            setLoading(true);

            try {
                const response = await fetch(`${BASE_URL}/interview`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        message: '自分史絵本を作りたいです',
                        mode: 'interview',
                        project_type: 'picturebook'
                    })
                });

                const data = await response.json();
                setLoading(false);
                addMessage('ai', data.reply);
                scrollToBottom();
                sessionStorage.setItem(`chat_${userId}`, 'started');
            } catch (error) {
                setLoading(false);
                addMessage('system', '❌ エラー: ' + error.message);
            }
        }

        async function sendMessage() {
            const userId = document.getElementById('userId').value;
            const message = messageInput.value.trim();

            if (!message) {
                alert('メッセージを入力してください');
                return;
            }

            addMessage('user', message);
            messageInput.value = '';
            messageInput.style.height = 'auto';

            setLoading(true);
            scrollToBottom();

            try {
                const response = await fetch(`${BASE_URL}/interview`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        message: message,
                        mode: 'interview',
                        project_type: 'picturebook'
                    })
                });

                const data = await response.json();
                setLoading(false);
                addMessage('ai', data.reply);
                scrollToBottom();
            } catch (error) {
                setLoading(false);
                addMessage('system', '❌ エラー: ' + error.message);
                scrollToBottom();
            }
        }

        function addMessage(type, content) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = content;
            chatContainer.appendChild(messageDiv);
        }

        function setLoading(show) {
            loading.classList.toggle('active', show);
            sendBtn.disabled = show;
            messageInput.disabled = show;
        }

        function scrollToBottom() {
            setTimeout(() => {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 100);
        }

        async function clearChat() {
            const userId = document.getElementById('userId').value;
            const messages = chatContainer.querySelectorAll('.message:not(.system)');
            messages.forEach(msg => msg.remove());
            sessionStorage.removeItem(`chat_${userId}`);

            try {
                await fetch(`${BASE_URL}/session/${userId}`, { method: 'DELETE' });
                addMessage('system', '✅ セッションをリセットしました');
            } catch (error) {
                addMessage('system', '⚠️ セッションのリセットに失敗しました');
            }

            await startInterview();
        }

        async function completeStoryGeneration() {
            const userId = document.getElementById('userId').value;
            const withImages = confirm('画像も生成しますか？\n\nはい: 絵本に画像を追加（7枚、約$0.28）\nいいえ: テキストのみ');

            addMessage('system', `🚀 統合フロー開始...\n\n1. 素材生成\n2. 自分史生成\n3. 絵本生成${withImages ? '（画像付き）' : ''}\n\n完了まで1〜2分お待ちください...`);
            scrollToBottom();
            setLoading(true);

            try {
                const response = await fetch(`${BASE_URL}/complete_story_generation/${userId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        generate_type: 'both',
                        page_count: 24,
                        with_images: withImages,
                        max_images: 7
                    })
                });

                const data = await response.json();
                setLoading(false);

                if (data.success) {
                    const summary = `✅ 物語生成完了！\n\n📊 生成結果：\n${data.steps_completed.map(step => `✓ ${step}`).join('\n')}\n\n📦 素材:\n- タイムライン: ${data.materials_summary.timeline_count}件\n- 人物: ${data.materials_summary.people_count}人\n- エピソード: ${data.materials_summary.episodes_count}件\n\n📖 自分史:\n- タイトル: ${data.story_summary?.title || 'N/A'}\n- 章数: ${data.story_summary?.chapters || 0}章\n\n📚 絵本:\n- タイトル: ${data.picturebook_summary?.title || 'N/A'}\n- ページ数: ${data.picturebook_summary?.pages || 0}ページ${withImages ? `\n- 生成画像: ${data.picturebook_summary?.images_generated || 0}枚` : ''}\n\n📁 保存先: ${data.output_paths.session}${withImages && data.output_paths.images ? `\n🖼️ 画像: ${data.output_paths.images}` : ''}`;
                    addMessage('ai', summary);
                } else {
                    addMessage('system', '❌ 生成に失敗しました');
                }
                scrollToBottom();
            } catch (error) {
                setLoading(false);
                addMessage('system', '❌ エラー: ' + error.message);
                scrollToBottom();
            }
        }

        async function getMaterials() {
            await generateContent('materials', '素材');
        }

        async function generateStory() {
            await generateContent('generate_story', '自分史');
        }

        async function generatePicturebook() {
            await generateContent('generate_picturebook', '絵本（テキストのみ）');
        }

        async function generatePicturebookWithImages() {
            const userId = document.getElementById('userId').value;
            const maxImages = 10;

            addMessage('system', `🎨 絵本生成（画像付き）を開始します...\n最大${maxImages}枚の画像を生成します（約${maxImages * 0.04}ドル）`);
            scrollToBottom();

            try {
                const response = await fetch(`${BASE_URL}/generate_picturebook_with_images/${userId}?max_images=${maxImages}`);
                const data = await response.json();
                const summary = `✅ 絵本生成完了！\n\n📊 結果：\n- 総ページ数: ${data.total_pages}ページ\n- 生成画像数: ${data.images_generated}枚\n- 推定コスト: $${data.cost_estimate_usd.toFixed(2)}\n\n🖼️ 生成された画像：\n${data.generated_images.map(img => `- Page ${img.page_number}: ${img.image_path}`).join('\n')}\n\n📁 画像保存先: output/picturebook_images/${userId}/`;
                addMessage('ai', summary);
                scrollToBottom();
            } catch (error) {
                addMessage('system', '❌ エラー: ' + error.message);
                scrollToBottom();
            }
        }

        async function generateContent(endpoint, type) {
            const userId = document.getElementById('userId').value;
            addMessage('system', `🔄 ${type}を生成中...`);
            scrollToBottom();

            try {
                const response = await fetch(`${BASE_URL}/${endpoint}/${userId}`);
                const data = await response.json();
                addMessage('ai', `✅ ${type}生成完了\n\n${JSON.stringify(data, null, 2).substring(0, 500)}...\n\n（全データはブラウザのコンソールに表示されます）`);
                console.log('Full data:', data);
                scrollToBottom();
            } catch (error) {
                addMessage('system', '❌ エラー: ' + error.message);
                scrollToBottom();
            }
        }

        // IME対応
        messageInput.addEventListener('compositionstart', () => {
            isComposing = true;
            justFinishedComposing = false;
        });

        messageInput.addEventListener('compositionend', () => {
            isComposing = false;
            justFinishedComposing = true;
            setTimeout(() => {
                justFinishedComposing = false;
            }, 100);
        });

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey && !isComposing && !justFinishedComposing) {
                e.preventDefault();
                sendMessage();
            }
        });

        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });
    </script>
</body>
</html>
